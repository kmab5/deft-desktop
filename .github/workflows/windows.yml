name: Windows CI and releases
run-name: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && format('Windows release · {0}', github.ref_name) || format('Windows CI · {0}', github.ref_name) }}

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && 'Test and package x64' || 'Test and compile x64' }}
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Rust x64 MSVC
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --target x86_64-pc-windows-msvc
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p deft-core
      - name: Compile desktop app against the packaged frontend
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --target x86_64-pc-windows-msvc -p deft-desktop --features tauri/custom-protocol
      - name: Explain CI result
        if: github.ref_type != 'tag' || !startsWith(github.ref_name, 'v')
        shell: pwsh
        run: |
          '### Windows CI passed' >> $env:GITHUB_STEP_SUMMARY
          'Tests passed and the x64 desktop app compiled. Windows packages are published by version-tag runs.' >> $env:GITHUB_STEP_SUMMARY
          "[Browse Windows releases]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/releases)" >> $env:GITHUB_STEP_SUMMARY
      - name: Build and package Windows release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        shell: pwsh
        env:
          DEFT_TAG: ${{ github.ref_name }}
          DEFT_SIGNING_PFX: ${{ secrets.DEFT_SIGNING_PFX }}
          DEFT_SIGNING_PASSWORD: ${{ secrets.DEFT_SIGNING_PASSWORD }}
        run: ./.github/scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
        with:
          name: deft-windows-x64-release
          path: release/*
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish to GitHub Releases
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: windows-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deft-windows-x64-release
          path: release
      - name: Publish verified assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFT_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prefix="deft-${DEFT_TAG}-windows-x64"
          assets=("$prefix-setup.exe" "$prefix.msi" "$prefix-portable.zip" "SHA256SUMS.txt")
          cd release
          sha256sum --check SHA256SUMS.txt
          for asset in "${assets[@]}"; do test -s "$asset"; done
          summarize_release() {
            root="$GITHUB_SERVER_URL/$GH_REPO/releases"
            {
              printf '### Windows release [%s](%s/tag/%s)\n\n' "$DEFT_TAG" "$root" "$DEFT_TAG"
              for asset in "${assets[@]}"; do
                printf -- '- [%s](%s/download/%s/%s)\n' "$asset" "$root" "$DEFT_TAG" "$asset"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if state=$(gh release view "$DEFT_TAG" --json isDraft,assets); then
            if [[ "$(jq -r .isDraft <<< "$state")" == false ]]; then
              for asset in "${assets[@]}"; do
                jq -e --arg name "$asset" 'any(.assets[]; .name == $name)' <<< "$state" > /dev/null
              done
              summarize_release
              exit 0
            fi
            gh release upload "$DEFT_TAG" "${assets[@]}" --clobber
          else
            flags=(--draft --verify-tag --generate-notes)
            if [[ "$DEFT_TAG" == v0.* ]]; then flags+=(--prerelease); fi
            gh release create "$DEFT_TAG" "${flags[@]}" "${assets[@]}"
          fi
          gh release edit "$DEFT_TAG" --draft=false
          summarize_release
