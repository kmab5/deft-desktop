name: Windows desktop

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup default 1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p deft-core
      - name: Build Windows installer
        env:
          DEFT_SIGNING_PFX: ${{ secrets.DEFT_SIGNING_PFX }}
          DEFT_SIGNING_PASSWORD: ${{ secrets.DEFT_SIGNING_PASSWORD }}
        shell: pwsh
        run: |
          $buildArgs = @('run', 'tauri', 'build', '--', '--bundles', 'nsis', '--ci')
          if ($env:DEFT_SIGNING_PFX) {
            $pfx = Join-Path $env:RUNNER_TEMP 'deft-signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:DEFT_SIGNING_PFX))
            try {
              $password = ConvertTo-SecureString $env:DEFT_SIGNING_PASSWORD -AsPlainText -Force
              $cert = Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My
              $cert = $cert | Where-Object HasPrivateKey | Select-Object -First 1
              if (!$cert) { throw 'No signing certificate with a private key found.' }
              $config = Join-Path $env:RUNNER_TEMP 'deft-signing.json'
              @{ bundle = @{ windows = @{
                certificateThumbprint = $cert.Thumbprint
                digestAlgorithm = 'sha256'
                timestampUrl = 'http://timestamp.digicert.com'
                tsp = $true
              }}} | ConvertTo-Json -Depth 6 | Set-Content $config
              $buildArgs += @('--config', $config)
            } finally {
              Remove-Item $pfx -ErrorAction SilentlyContinue
            }
          }
          & npm @buildArgs -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: deft-windows-x64-nsis
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deft-windows-x64-nsis
          path: installers
      - name: Publish tagged installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFT_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes)
          if [[ "$DEFT_TAG" == v0.* ]]; then args+=(--prerelease); fi
          gh release create "$DEFT_TAG" installers/*.exe "${args[@]}"
